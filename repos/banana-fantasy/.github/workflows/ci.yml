name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only run the latest workflow per branch — cancel stale runs when a new
# commit arrives, so PRs don't sit behind a queue of obsolete checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx next lint --max-warnings 0

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # Build with placeholder env so fail-loud helpers don't crash CI on
      # env vars that are only present at deploy time. Keeps the typecheck +
      # build paths exercised; deploy-time validation still happens on Vercel.
      - run: npm run build
        env:
          NEXT_PUBLIC_ENVIRONMENT: staging
          NEXT_PUBLIC_APP_URL: https://banana-fantasy-sbs.vercel.app
          NEXT_PUBLIC_PRIVY_APP_ID: ci-placeholder
